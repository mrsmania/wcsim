<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Draft an XI of real World Cup players, one position at a time, then play a simulated group stage and knockout run and try to win the cup."
    />
    <!-- The browser chrome's colour, per theme. It matters more here than usual: the boot
         cover below paints its own literal background before any CSS loads, so without
         these the phone's address bar sat at its default while the page underneath was
         already paper or near-black. Same literals as the boot screen, and `npm run
         checks` holds them to --color-ground the same way (H102). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131417" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><rect width='28' height='28' rx='6' fill='%230e5c34'/><g fill='none' stroke='%23e4922b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' transform='translate(2 2)'><path d='M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978'/><path d='M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978'/><path d='M18 9h1.5a1 1 0 0 0 0-5H18'/><path d='M4 22h16'/><path d='M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z'/><path d='M6 9H4.5a1 1 0 0 1 0-5H6'/></g></svg>"
    />
    <script>
      /* Apply the saved theme before paint to avoid a flash of the light theme.
         The storage key is HARDCODED here and cannot be otherwise: this runs before any
         module loads, so it cannot import `SETTINGS_KEY` from the module that owns it.
         Bump that key and every dark-theme player gets a light flash on load, with no
         compile error to say so - so bump it here too. `npm run checks` asserts the two
         agree (H102), which is the only guard available. */
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('wcsim_settings_v1') || '{}');
          if (s && s.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Mundialito</title>
    <style>
      /* Boot screen. Everything here is inline on purpose: index.css arrives with the
         bundle, so until then the page would paint the browser's default white - and
         for a signed-in player the first render also waits on one round trip to the
         account server, which is seconds on a bad connection. Colours are literal
         copies of the --color-ground / -ink / -pitch / -pitch-dark / -line / -amber tokens,
         since the custom properties are not loaded yet either. Every one of them now
         carries both themes: the trophy's amber was the last exception, an SVG
         presentation attribute with no dark rule, and it is a CSS rule below (H140).

         `npm run checks` asserts every literal here against the token it copies, so the
         two files can no longer drift apart unnoticed (H139). Move a colour in
         src/index.css and here, and the check says so if you miss one.

         The markup sits OUTSIDE #root, so React never owns it: main.tsx stamps
         data-booted on <html> after the first render and the rules below fade it out. */
      html {
        background: #f4f2ec;
      }
      html[data-theme='dark'] {
        background: #131417;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: inherit;
      }
      #boot .bootbox {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        /* Hidden for the first third of a second: a fast load should show nothing at
           all rather than blink a spinner at the player. */
        opacity: 0;
        animation: boot-in 0.25s ease-out 0.35s both;
      }
      #boot .boottile {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 8px;
        background: #0e5c34;
      }
      html[data-theme='dark'] #boot .boottile {
        background: #17492f;
      }
      /* The trophy's amber. A CSS rule rather than the svg's own stroke attribute, so
         that it can have a dark value like every other colour here - the attribute
         could not be overridden and so shipped the light amber on graphite too. */
      #boot .boottile svg {
        stroke: #e4922b;
      }
      html[data-theme='dark'] #boot .boottile svg {
        stroke: #eea23a;
      }
      #boot .bootmark {
        font-family: Archivo, 'Helvetica Neue', Arial, sans-serif;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #13211a;
      }
      html[data-theme='dark'] #boot .bootmark {
        color: #eceef1;
      }
      #boot .bootspin {
        width: 20px;
        height: 20px;
        border: 2px solid #d4ded5;
        border-top-color: #0e5c34;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      html[data-theme='dark'] #boot .bootspin {
        border-color: #33363d;
        border-top-color: #22a35d;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Once the app has painted. Left in the DOM but inert; no JS teardown to get
         wrong, and the fade covers the frame the swap lands on. */
      html[data-booted] #boot {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.2s ease-out,
          visibility 0.2s;
      }
      @media (prefers-reduced-motion: reduce) {
        /* No spin, and no delayed fade-in either: with the animation off, `both`
           would hold the box at opacity 0 and hide the whole thing. */
        #boot .bootbox {
          opacity: 1;
          animation: none;
        }
        #boot .bootspin {
          animation: none;
        }
        html[data-booted] #boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="Loading Mundialito">
      <div class="bootbox">
        <span class="boottile">
          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978" />
            <path d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978" />
            <path d="M18 9h1.5a1 1 0 0 0 0-5H18" />
            <path d="M4 22h16" />
            <path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z" />
            <path d="M6 9H4.5a1 1 0 0 1 0-5H6" />
          </svg>
        </span>
        <span class="bootmark">Mundialito</span>
        <span class="bootspin"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
