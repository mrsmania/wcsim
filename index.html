<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The search snippet. Deliberately the SAME sentence as og:description below, and
         not a second attempt at describing the game: both answer "what is this" for a
         reader who has seen nothing else, so a second wording is one more thing to keep
         true. It carries no figure on purpose - see the note under the preview tags about
         the one number in this file that cannot derive itself. -->
    <meta
      name="description"
      content="A random World Cup squad comes up. You take one player, and he never comes up again. Do that eleven times, then play the tournament."
    />
    <!-- The link preview. This is the front door and not a nicety: a duel invitation
         travels as a link by design, so the first thing most people ever see of the game
         is whatever a chat client draws from these tags.

         EVERY URL HERE IS ABSOLUTE, and it has to be: a preview crawler fetches the tag
         values on their own, with no page to resolve a relative path against. The same
         rule already caught the sign-in email's logo (see CLAUDE.md, "Hosting"), and it
         fails silently in exactly the same way - a blank preview, no error anywhere.
         The host is the custom domain, which serves from the root.

         THE "15" IS THE ONE FIGURE IN THIS FILE THAT CANNOT DERIVE ITSELF. A meta tag is
         static text; nothing reads WORLD_CUP_YEARS here. It was 15 when this was written,
         verified against src/data/squads.ts, so: ADD A TOURNAMENT AND CHANGE IT HERE TOO,
         in both the og and twitter copies, or the front door starts undercounting the game.

         The image is built by `python scripts/build-share-card.py`, which derives its four
         cards from the dataset (the highest-rated collectibles) and its colours from the
         palette tokens. Re-run it after a ratings pass or a change to the card art. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mondialino" />
    <meta property="og:url" content="https://mondialino.ch/" />
    <meta property="og:title" content="Mondialino - draft an XI from 15 World Cups" />
    <meta
      property="og:description"
      content="A random World Cup squad comes up. You take one player, and he never comes up again. Do that eleven times, then play the tournament."
    />
    <meta property="og:image" content="https://mondialino.ch/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Four drawn sticker cards of World Cup players, side by side under the Mondialino wordmark."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mondialino - draft an XI from 15 World Cups" />
    <meta
      name="twitter:description"
      content="A random World Cup squad comes up. You take one player, and he never comes up again. Do that eleven times, then play the tournament."
    />
    <meta name="twitter:image" content="https://mondialino.ch/share-card.png" />
    <meta
      name="twitter:image:alt"
      content="Four drawn sticker cards of World Cup players, side by side under the Mondialino wordmark."
    />
    <!-- The browser chrome's colour, per theme. It matters more here than usual: the boot
         cover below paints its own literal background before any CSS loads, so without
         these the phone's address bar sat at its default while the page underneath was
         already paper or near-black. Same literals as the boot screen, and `npm run
         checks` holds them to --color-ground the same way (H102). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131417" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><rect width='28' height='28' rx='6' fill='%230e5c34'/><g fill='none' stroke='%23e4922b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' transform='translate(2 2)'><path d='M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978'/><path d='M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978'/><path d='M18 9h1.5a1 1 0 0 0 0-5H18'/><path d='M4 22h16'/><path d='M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z'/><path d='M6 9H4.5a1 1 0 0 1 0-5H6'/></g></svg>"
    />
    <script>
      /* Apply the saved theme before paint to avoid a flash of the light theme.
         The storage key is HARDCODED here and cannot be otherwise: this runs before any
         module loads, so it cannot import `SETTINGS_KEY` from the module that owns it.
         Bump that key and every dark-theme player gets a light flash on load, with no
         compile error to say so - so bump it here too. `npm run checks` asserts the two
         agree (H102), which is the only guard available. */
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('wcsim_settings_v1') || '{}');
          if (s && s.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Recursive:MONO,wght@1,400..800&family=Rubik:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Mondialino</title>
    <style>
      /* Boot screen. Everything here is inline on purpose: index.css arrives with the
         bundle, so until then the page would paint the browser's default white - and
         for a signed-in player the first render also waits on one round trip to the
         account server, which is seconds on a bad connection. Colours are literal
         copies of the --color-ground / -ink / -pitch / -pitch-dark / -line / -amber tokens,
         since the custom properties are not loaded yet either. Every one of them now
         carries both themes: the trophy's amber was the last exception, an SVG
         presentation attribute with no dark rule, and it is a CSS rule below (H140).

         `npm run checks` asserts every literal here against the token it copies, so the
         two files can no longer drift apart unnoticed (H139). Move a colour in
         src/index.css and here, and the check says so if you miss one.

         The markup sits OUTSIDE #root, so React never owns it: main.tsx stamps
         data-booted on <html> after the first render and the rules below fade it out. */
      html {
        background: #f4f2ec;
      }
      html[data-theme='dark'] {
        background: #131417;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: inherit;
      }
      #boot .bootbox {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        /* Hidden for the first third of a second: a fast load should show nothing at
           all rather than blink a spinner at the player. */
        opacity: 0;
        animation: boot-in 0.25s ease-out 0.35s both;
      }
      #boot .boottile {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 8px;
        background: #0e5c34;
      }
      html[data-theme='dark'] #boot .boottile {
        background: #17492f;
      }
      /* The trophy's amber. A CSS rule rather than the svg's own stroke attribute, so
         that it can have a dark value like every other colour here - the attribute
         could not be overridden and so shipped the light amber on graphite too. */
      #boot .boottile svg {
        stroke: #e4922b;
      }
      html[data-theme='dark'] #boot .boottile svg {
        stroke: #eea23a;
      }
      #boot .bootmark {
        font-family: Rubik, 'Helvetica Neue', Arial, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #13211a;
      }
      html[data-theme='dark'] #boot .bootmark {
        color: #eceef1;
      }
      #boot .bootspin {
        width: 20px;
        height: 20px;
        border: 2px solid #d4ded5;
        border-top-color: #0e5c34;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      html[data-theme='dark'] #boot .bootspin {
        border-color: #33363d;
        border-top-color: #22a35d;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Once the app has painted. Left in the DOM but inert; no JS teardown to get
         wrong, and the fade covers the frame the swap lands on. */
      html[data-booted] #boot {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.2s ease-out,
          visibility 0.2s;
      }
      @media (prefers-reduced-motion: reduce) {
        /* No spin, and no delayed fade-in either: with the animation off, `both`
           would hold the box at opacity 0 and hide the whole thing. */
        #boot .bootbox {
          opacity: 1;
          animation: none;
        }
        #boot .bootspin {
          animation: none;
        }
        html[data-booted] #boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="Loading Mondialino">
      <div class="bootbox">
        <span class="boottile">
          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978" />
            <path d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978" />
            <path d="M18 9h1.5a1 1 0 0 0 0-5H18" />
            <path d="M4 22h16" />
            <path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z" />
            <path d="M6 9H4.5a1 1 0 0 1 0-5H6" />
          </svg>
        </span>
        <span class="bootmark">Mondialino</span>
        <span class="bootspin"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
