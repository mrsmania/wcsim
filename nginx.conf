server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app with a History-API router (react-router, clean paths), so this
  # fallback is LOAD-BEARING, not speculative: without it every deep link
  # (/squads/team/bra-2002, /records/cabinet) 404s on refresh. It is the nginx equivalent
  # of the dist/404.html that scripts/copy-404.mjs writes for GitHub Pages.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache the hashed assets aggressively; never cache the HTML shell.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
