name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The domain characterization harness (scripts/checks.ts). There is no unit-test
      # runner in this project, so this plus `tsc` is the whole safety net, and until now
      # it depended on the author remembering to run it. It needs no secrets and no
      # network, and takes ~17s. Before the build deliberately: a domain regression
      # should fail the job without also publishing the artifact.
      #
      # It also carries the collectible-seed staleness guard, which is what makes
      # forgetting `npm run gen:collectibles` after a rating change impossible rather
      # than merely discouraged.
      - run: npm run checks
      - run: npm run build
        # Accounts config. Repository *variables*, not secrets: the anon key is
        # designed to ship inside the browser bundle, and row-level security is what
        # protects data (docs/cloud-sync-design.md §11). With these unset the build
        # simply has no server, FEATURES.accounts stays off, and the deployed site is
        # the guest-only game - which is also what a fork of this repo gets.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
