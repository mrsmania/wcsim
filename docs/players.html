<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Player index</title>
<!--
  GENERATED FILE - do not edit by hand.
  Template: scripts/players-page.template.html, filled in by scripts/gen-players-page.ts
  (the game's own dataset) or scripts/gen-players-page-other.ts (the comparison CSV).
  Regenerate both with `npm run gen:players`.

  A standalone reference sheet over a whole dataset: every player of every squad of
  every tournament in one sortable, filterable table. It is NOT part of the app - open
  the file in a browser straight off disk. Nothing here imports from src/, and nothing
  in src/ imports this; the data is baked in at generation time.

  ONE template, two pages, so the two datasets can be read side by side and compared.
  Everything the two differ by arrives in the data blob's `page` block.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Turf-flat tokens, copied from src/index.css. Keep them in step by hand: this page
   ships no Tailwind and no build step beyond the generator. */
:root {
  --ground: #f4f2ec; --panel: #ffffff; --chalk: #e8f0e8; --ink: #13211a;
  --muted: #5c6a60; --line: #d4ded5; --pitch: #15924c; --pitch-dark: #0e5c34;
  --accent: #0e5c34; --amber: #e4922b; --dim: #636c65; --hair: #e3e8e2;
  --faint: #ecebe3; --amber-ink: #9a6512; --loss: #c8453c;
  --shadow-hard: 6px 6px 0 var(--pitch-dark);
  --sans: 'Schibsted Grotesk', system-ui, sans-serif;
  --mono: 'Spline Sans Mono', ui-monospace, monospace;
  --display: 'Archivo', system-ui, sans-serif;
  --row-h: 34px;
}
:root[data-theme='dark'] {
  --ground: #131417; --panel: #1c1e22; --chalk: #26282e; --ink: #eceef1;
  --muted: #a4a9b0; --line: #33363d; --pitch: #22a35d; --pitch-dark: #17492f;
  --accent: #34c06f; --amber: #eea23a; --dim: #848b92; --hair: #2a2d33;
  --faint: #191b1f; --amber-ink: #eea23a; --loss: #e86b5b;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }

/* ---- masthead ---------------------------------------------------------- */
.mast { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 2px solid var(--ink); background: var(--panel); }
.tile { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 6px; background: var(--pitch-dark); color: var(--amber); }
.word { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; font-size: 17px; line-height: 1; text-transform: uppercase; }
.tag { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); margin-top: 4px; }
.mast .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 5px; padding: 7px 11px;
  font-family: var(--mono); font-size: 11.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  transition: border-color .12s, color .12s;
}
.btn:hover { border-color: var(--pitch); color: var(--pitch); }
.btn[aria-pressed='true'] { background: var(--ink); color: var(--ground); border-color: var(--ink); }

/* ---- page -------------------------------------------------------------- */
main { max-width: 1400px; margin: 0 auto; padding: 0 20px 40px; }
.head { display: flex; align-items: center; gap: 16px; margin: 26px 0 18px; }
.eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
h1 { font-family: var(--display); font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; margin: 3px 0 0; }
.rule { position: relative; flex: 1; height: 0; border-top: 2px solid var(--line); }
.rule::before { content: ''; position: absolute; top: -5px; left: 0; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow-hard); }
.mono-cap { font-family: var(--mono); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }

/* ---- filters ----------------------------------------------------------- */
.filters { padding: 14px 16px; margin-bottom: 22px; }
.frow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > .mono-cap { padding-left: 1px; }

.search { position: relative; }
.search input {
  width: 260px; max-width: 100%; padding: 8px 30px 8px 30px;
  border: 1px solid var(--line); border-radius: 5px; background: var(--panel); outline: none;
  font-size: 13.5px;
}
.search input:focus { border-color: var(--pitch); }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .clr { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; cursor: pointer; color: var(--muted); padding: 4px; line-height: 0; border-radius: 4px; }
.search .clr:hover { color: var(--ink); }

/* multi-select */
.ms { position: relative; }
.ms > button {
  display: inline-flex; align-items: center; gap: 8px; min-width: 148px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 5px; background: var(--panel);
  padding: 8px 10px; font-size: 13px; text-align: left;
}
.ms > button:hover { border-color: var(--pitch); }
.ms > button[aria-expanded='true'] { border-color: var(--pitch); }
.ms .val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms .val.any { color: var(--muted); }
.ms .cnt { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--panel); background: var(--pitch); border-radius: 999px; padding: 1px 6px; }
.ms .chev { color: var(--muted); line-height: 0; }
.pop {
  position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; min-width: 100%;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 14px 34px rgba(0,0,0,.14);
  padding: 6px; display: none;
}
.pop.open { display: block; }
.pop .psearch { width: 100%; padding: 6px 8px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); outline: none; font-size: 13px; }
.pop .psearch:focus { border-color: var(--pitch); }
.pop .list { max-height: 304px; overflow: auto; }
.opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 7px; border: 0; background: none; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; text-align: left; }
.opt:hover, .opt:focus-visible { background: var(--chalk); outline: none; }
.opt .box { width: 14px; height: 14px; border: 1.5px solid var(--line); border-radius: 3px; display: grid; place-items: center; flex: none; color: var(--panel); }
.opt.on .box { background: var(--pitch); border-color: var(--pitch); }
.opt .n { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--muted); padding-left: 10px; }
.pop .pfoot { display: flex; justify-content: space-between; border-top: 1px solid var(--hair); margin-top: 6px; padding-top: 6px; }
.pop .pfoot button { border: 0; background: none; cursor: pointer; font-family: var(--mono); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 3px 5px; border-radius: 4px; }
.pop .pfoot button:hover { color: var(--pitch); }

/* A filter the active dataset cannot answer. It keeps whatever was selected, so
   the query comes back intact on the way to the other one - it just does not
   filter, and says so rather than disappearing. */
.field.off > .mono-cap { color: var(--dim); }
.ms.off > button { background: var(--faint); border-color: var(--hair); color: var(--dim); cursor: not-allowed; }
.ms.off > button:hover { border-color: var(--hair); }
.ms.off .val, .ms.off .val.any, .ms.off .chev { color: var(--dim); }
.ms.off .cnt { background: var(--dim); }

/* dual-handle rating slider */
.rng { position: relative; width: 210px; height: 30px; display: flex; align-items: center; }
.rng .track { position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: var(--line); }
.rng .fill { position: absolute; height: 4px; border-radius: 2px; background: var(--pitch); }
.rng input {
  position: absolute; left: 0; width: 100%; margin: 0; height: 30px;
  background: none; pointer-events: none; -webkit-appearance: none; appearance: none;
}
.rng input:focus { outline: none; }
.rng input::-webkit-slider-thumb {
  -webkit-appearance: none; pointer-events: auto; width: 15px; height: 15px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--pitch); cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,.2);
}
.rng input::-moz-range-thumb {
  pointer-events: auto; width: 13px; height: 13px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--pitch); cursor: grab;
}
.rng input:focus-visible::-webkit-slider-thumb { border-color: var(--amber); }
.rng input:focus-visible::-moz-range-thumb { border-color: var(--amber); }
.rlab { font-family: var(--mono); font-size: 12px; font-weight: 600; min-width: 62px; }
.rlab b { color: var(--pitch); }

.fspacer { flex: 1; }
.count { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.count b { color: var(--ink); font-weight: 700; }
.count .gone { color: var(--amber-ink); }

/* ---- table ------------------------------------------------------------- */
.table { overflow: hidden; }
.scroller { overflow: auto; max-height: calc(100vh - 150px); overscroll-behavior: contain; }
.grid { min-width: 900px; }
/* The column widths come from the data blob, and there is ONE set of them for
   every dataset: the two are meant to be read against each other, so a column
   that moved when the toggle was thrown would defeat the whole thing. */
.cols {
  display: grid;
  grid-template-columns: var(--grid-cols);
  align-items: center; gap: 10px; padding: 0 14px;
}
.thead { position: sticky; top: 0; z-index: 3; background: var(--panel); border-bottom: 2px solid var(--ink); height: 38px; }
.th {
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer; border: 0; background: none; padding: 2px 0;
  font-family: var(--mono); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
}
.th:hover { color: var(--pitch); }
.th.on { color: var(--ink); }
.th .ar { opacity: 0; line-height: 0; }
.th.on .ar { opacity: 1; color: var(--pitch); }
.th.r { justify-content: flex-end; }
.tbody { position: relative; }

.row {
  position: absolute; left: 0; right: 0; height: var(--row-h);
  border-bottom: 1px solid var(--hair); font-size: 13px;
}
.row:hover { background: var(--chalk); }
.row.kin { background: color-mix(in srgb, var(--amber) 12%, transparent); }
.num { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.nm { display: flex; align-items: center; gap: 6px; min-width: 0; }
.nm span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.dup {
  flex: none; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.02em;
  color: var(--amber-ink); border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
  border-radius: 999px; padding: 1px 5px; cursor: help;
}
.ctry { display: flex; align-items: center; gap: 7px; min-width: 0; }
.ctry span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl { flex: none; width: 21px; height: 14px; border-radius: 2px; background-size: cover; background-position: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.yr, .pos { font-family: var(--mono); font-size: 11.5px; }
.yr { color: var(--muted); font-variant-numeric: tabular-nums; }
.pos { font-weight: 600; }
.alt { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rat { font-family: var(--mono); font-size: 13.5px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.dif { font-family: var(--mono); font-size: 12px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.dif.up { color: var(--pitch); }
.dif.dn { color: var(--loss); }
.dif.eq, .dif.no { color: var(--dim); }
.col { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-family: var(--mono); font-size: 11.5px; }
.col.no { color: var(--dim); }
.star { flex: none; width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.star svg { width: 9px; height: 9px; }
.acc { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }

.empty { padding: 46px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-family: var(--display); font-size: 17px; margin-bottom: 6px; }

/* ---- appearance tooltip ------------------------------------------------ */
.tip {
  position: fixed; z-index: 90; display: none; pointer-events: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 16px 40px rgba(0,0,0,.2);
  padding: 9px 11px; min-width: 236px;
}
.tip.show { display: block; }
.tip .th2 { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 7px; }
.tip .th2 b { color: var(--ink); font-family: var(--sans); font-size: 13px; letter-spacing: 0; text-transform: none; display: block; margin-bottom: 2px; }
.tip .ap { display: grid; grid-template-columns: 40px 21px 1fr auto auto; align-items: center; gap: 8px; padding: 3px 0; font-size: 12.5px; }
.tip .ap + .ap { border-top: 1px solid var(--hair); }
.tip .ap.self { color: var(--pitch); font-weight: 600; }
.tip .ap .y { font-family: var(--mono); font-size: 11.5px; }
.tip .ap .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip .ap .p { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.tip .ap.self .p { color: var(--pitch); }
.tip .ap .e { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; }

.foot { display: block; margin-top: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--dim); letter-spacing: 0.02em; }

@media (max-width: 720px) {
  main { padding: 0 12px 30px; }
  .search input { width: 100%; }
  .scroller { max-height: calc(100vh - 120px); }
}

/* ---- dataset toggle ---------------------------------------------------- */
.seg { display: flex; overflow: hidden; border: 1px solid var(--line); border-radius: 5px; }
.seg button {
  display: flex; align-items: baseline; gap: 6px; cursor: pointer;
  border: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--muted);
  padding: 7px 12px; font-family: var(--mono); font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em; transition: color .12s;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--pitch); }
.seg button[aria-pressed='true'] { background: var(--ink); color: var(--ground); }
.seg button .n { font-size: 10px; font-weight: 500; letter-spacing: 0.02em; opacity: .7; }
.setlab { display: flex; align-items: center; gap: 8px; }
@media (max-width: 720px) {
  .head { flex-wrap: wrap; }
  .head .rule { order: 3; flex-basis: 100%; }
}
</style>
</head>

    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>

  <span>

  <span class="right">

</header>

<main>
  <div class="head">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
    </div>
    <div class="rule"></div>
    <!-- Only rendered when the file carries more than one dataset. -->
    <div class="setlab" id="setlab" hidden>
      <span class="mono-cap">Dataset</span>
      <div class="seg" id="seg"></div>
    </div>
  </div>

  <section class="card filters">
    <div class="frow">
      <div class="field">
        <span class="mono-cap">Search</span>
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input id="q" type="search" placeholder="Player name" autocomplete="off" spellcheck="false" />
          <button class="clr" id="qclr" type="button" title="Clear" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <!-- The multi-selects are built from the active dataset: the two do not carry
           the same set (one gives a player a single position), and their options are
           the nations and tournaments that dataset actually holds. -->
      <span id="msfields" style="display:contents"></span>

      <div class="field">
        <span class="mono-cap">Rating</span>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="rng">
            <div class="track"></div><div class="fill" id="rfill"></div>
            <input id="rmin" type="range" aria-label="Minimum rating" />
            <input id="rmax" type="range" aria-label="Maximum rating" />
          </div>
          <span class="rlab"><b id="rminl"></b> &ndash; <b id="rmaxl"></b></span>
        </div>
      </div>

      <span class="fspacer"></span>
      <div class="field" style="align-items:flex-end">
        <span class="count" id="count"></span>
        <button class="btn" id="reset" type="button">Clear filters</button>
      </div>
    </div>
  </section>

  <section class="card table">
    <div class="scroller" id="scroller">
      <div class="grid">
        <div class="cols thead" id="thead"></div>
        <div class="tbody" id="tbody"></div>
      </div>
      <div class="empty" id="empty" hidden><b>No players match</b>Widen the rating range or clear a filter.</div>
    </div>
  </section>

  <p class="foot" id="foot"></p>
</main>

/* ---------------------------------------------------------------------------
   The file can carry more than one dataset - WCS (the game's own) and 7a0
   (another game's ratings) - and the toggle switches between them. THE UI IS THE
   SAME FOR BOTH: the same columns at the same widths, the same filters in the
   same order. Only three things change with the toggle, and each is a fact about
   the data rather than a layout choice: the wording, what the last column means
   (a sticker tier here, the source's own "legend" flag there), and whether the
   two extra position filters can be answered at all - 7a0 gives a player one
   position, so they grey out rather than vanishing.

   THE QUERY SURVIVES THE SWITCH, which is the whole point of having both in one
   file: the filters are held as VALUES (a nation code, a year, a position), not
   as indices into one dataset's tables, so flipping to the other dataset asks
   the same question of it. A value the other one does not hold (2026, say, or a
   nation it never lists) is dropped, and `#gone` says how many.
--------------------------------------------------------------------------- */
const POS = DATA.pos;                      // the twelve, shared by both datasets

/** Decoded columns per dataset, built on first use and kept, so a toggle back is
 *  instant. Every filter and sort reads these flat typed arrays, never objects. */
const CACHE = [];

function decode(index) {
  if (CACHE[index]) return CACHE[index];
  const S = DATA.sets[index];
  const N = S.rows.length / 7;
  const d = {
    set: S,
    page: S.page,
    N,
    person: new Int32Array(N), nation: new Int16Array(N), year: new Uint8Array(N),
    num: new Uint8Array(N), combo: new Int16Array(N), elo: new Uint8Array(N), tier: new Uint8Array(N),
    // What the OTHER dataset rates the same man at, as a difference. DIFF_NONE
    // (127) is "he is not in it" - no real difference can reach it.
    diff: Int8Array.from(S.diffs),
  };
  for (let i = 0, r = 0; i < N; i++, r += 7) {
    d.person[i] = S.rows[r]; d.nation[i] = S.rows[r + 1]; d.year[i] = S.rows[r + 2];
    d.num[i] = S.rows[r + 3]; d.combo[i] = S.rows[r + 4]; d.elo[i] = S.rows[r + 5]; d.tier[i] = S.rows[r + 6];
  }

  // Position combos: the main role, the mask of every role, the mask of the extras.
  const n = S.combos.length;
  d.comboMain = new Uint8Array(n);
  d.comboAll = new Int32Array(n);
  d.comboAdd = new Int32Array(n);
  d.comboAltHtml = new Array(n);
  S.combos.forEach((c, i) => {
    d.comboMain[i] = c[0];
    let all = 0; for (const p of c) all |= 1 << p;
    d.comboAll[i] = all; d.comboAdd[i] = all & ~(1 << c[0]);
    d.comboAltHtml[i] = c.length > 1 ? c.slice(1).map((p) => POS[p]).join(' &middot; ') : '&ndash;';
  });

  d.personHtml = S.persons.map(esc);
  d.personKey = S.persons.map(fold);
  d.natHtml = S.nations.map((x) => esc(x[1]));

  /* Every appearance of each person, oldest first. This is what the hover card
     reads, and what puts the "x N" mark on a row: one row, no mark. */
  d.apps = new Array(S.persons.length);
  for (let i = 0; i < N; i++) (d.apps[d.person[i]] || (d.apps[d.person[i]] = [])).push(i);
  for (const a of d.apps) if (a && a.length > 1) a.sort((x, y) => d.year[x] - d.year[y]);

  // Counts per option, so a dropdown says how much of the dataset it holds.
  d.mainCount = new Array(POS.length).fill(0);
  d.addCount = new Array(POS.length).fill(0);
  d.anyCount = new Array(POS.length).fill(0);
  d.natCount = new Array(S.nations.length).fill(0);
  d.yearCount = new Array(S.years.length).fill(0);
  for (let i = 0; i < N; i++) {
    const c = d.combo[i];
    d.mainCount[d.comboMain[c]]++;
    d.natCount[d.nation[i]]++;
    d.yearCount[d.year[i]]++;
    for (const p of S.combos[c]) d.anyCount[p]++;
    for (let k = 1; k < S.combos[c].length; k++) d.addCount[S.combos[c][k]]++;
  }

  d.view = new Int32Array(N);
  CACHE[index] = d;
  return d;
}

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fold = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/* ---------------------------------------------------------------------------
   Filter state. Held as VALUES so it survives a dataset switch (see above).
--------------------------------------------------------------------------- */
const state = {
  q: '',
  main: new Set(), add: new Set(), any: new Set(),   // position indices (shared vocabulary)
  nat: new Set(),                                    // nation CODES
  year: new Set(),                                   // years
  col: new Set(),                                    // 1 = collectible / legend, 0 = not
  lo: 0, hi: 0,
  /* Whether the reader has actually moved the rating handles. An untouched range
     opens to the incoming dataset's own scale on a switch rather than being
     clamped to the outgoing one - the two do not share a floor (62 here, 64
     there), and clamping quietly dropped 63 rows nobody had filtered out. */
  rangeSet: false,
  sort: 'rating', dir: -1,
};

let D = null;                                        // the active decoded dataset
let P = null;                                        // its page block
let otherTab = '';                                   // what the other one is called
let view = null;                                     // the filtered + sorted row ids
let viewLen = 0;
let dropped = 0;                                     // values the switch could not carry

function maskOf(set) { let m = 0; for (const p of set) m |= 1 << p; return m; }

function applyFilters() {
  const mMain = maskOf(state.main);
  // A filter this dataset cannot answer keeps its selection and stops filtering.
  const mAdd = P.alt ? maskOf(state.add) : 0, mAny = P.alt ? maskOf(state.any) : 0;
  const colOn = state.col.size === 1, wantCol = state.col.has(1);
  const lo = state.lo, hi = state.hi;
  const N = D.N;

  // Nations and years are held by value, so they resolve to this dataset's own
  // indices once per pass rather than per row.
  let natOk = null;
  if (state.nat.size) {
    natOk = new Uint8Array(D.set.nations.length);
    D.set.nations.forEach((x, i) => { if (state.nat.has(x[0])) natOk[i] = 1; });
  }
  let yearOk = null;
  if (state.year.size) {
    yearOk = new Uint8Array(D.set.years.length);
    D.set.years.forEach((y, i) => { if (state.year.has(y)) yearOk[i] = 1; });
  }

  // The name query is answered per PERSON and then read per row.
  let nameOk = null;
  const q = state.q;
  if (q) {
    nameOk = new Uint8Array(D.personKey.length);
    for (let p = 0; p < D.personKey.length; p++) if (D.personKey[p].includes(q)) nameOk[p] = 1;
  }

  let n = 0;
  for (let i = 0; i < N; i++) {
    const e = D.elo[i];
    if (e < lo || e > hi) continue;
    const c = D.combo[i];
    if (mMain && !((1 << D.comboMain[c]) & mMain)) continue;
    if (mAdd && !(D.comboAdd[c] & mAdd)) continue;
    if (mAny && !(D.comboAll[c] & mAny)) continue;
    if (natOk && !natOk[D.nation[i]]) continue;
    if (yearOk && !yearOk[D.year[i]]) continue;
    if (colOn && (D.tier[i] > 0) !== wantCol) continue;
    if (nameOk && !nameOk[D.person[i]]) continue;
    view[n++] = i;
  }
  viewLen = n;
  sortView();
}

/* Sort keys by column id. Ties fall through to rating, then name, so the order
   is total and a re-sort never shuffles equal rows about. */
const KEY = {
  num: (i) => D.num[i],
  year: (i) => D.year[i],
  main: (i) => D.comboMain[D.combo[i]],
  alt: (i) => { const a = D.comboAdd[D.combo[i]]; return a ? 31 - Math.clz32(a & -a) : 99; },
  rating: (i) => D.elo[i],
  col: (i) => D.tier[i],
};

/** No counterpart in the other dataset. Mirrors DIFF_NONE in the generator. */
const NO_DIFF = 127;

function sortView() {
  const d = state.dir, s = state.sort;
  const sub = view.subarray(0, viewLen);
  const arr = Array.prototype.slice.call(sub);
  const key = D.personKey, person = D.person, nations = D.set.nations;
  const byName = (a, b) => (key[person[a]] < key[person[b]] ? -1 : key[person[a]] > key[person[b]] ? 1 : 0);
  let cmp;
  if (s === 'name') {
    cmp = (a, b) => d * byName(a, b) || D.year[a] - D.year[b] || D.nation[a] - D.nation[b];
  } else if (s === 'nat') {
    cmp = (a, b) => d * (nations[D.nation[a]][1] < nations[D.nation[b]][1] ? -1 : nations[D.nation[a]][1] > nations[D.nation[b]][1] ? 1 : 0)
      || D.year[a] - D.year[b] || D.elo[b] - D.elo[a];
  } else if (s === 'diff') {
    // A player the other dataset has not got sorts last either way: he is not a
    // small difference, he is an absent one.
    cmp = (a, b) => {
      const x = D.diff[a], y = D.diff[b];
      if ((x === NO_DIFF) !== (y === NO_DIFF)) return x === NO_DIFF ? 1 : -1;
      if (x === NO_DIFF) return D.elo[b] - D.elo[a];
      return d * (x - y) || D.elo[b] - D.elo[a];
    };
  } else if (s === 'main' || s === 'alt') {
    // Positions sort in pitch order (GK -> ST), which is the order POS is in.
    const k = KEY[s];
    cmp = (a, b) => d * (k(a) - k(b)) || D.elo[b] - D.elo[a];
  } else {
    const k = KEY[s];
    cmp = (a, b) => d * (k(a) - k(b)) || D.elo[b] - D.elo[a] || byName(a, b);
  }
  arr.sort(cmp);
  for (let i = 0; i < arr.length; i++) sub[i] = arr[i];
}

/* ---------------------------------------------------------------------------
   Virtualised body. Only the visible window is in the DOM (plus a small
   overscan), so a whole dataset costs the same as 40 rows.
--------------------------------------------------------------------------- */
const ROW_H = 34, OVERSCAN = 8;
const scroller = document.getElementById('scroller');
const tbody = document.getElementById('tbody');
const thead = document.getElementById('thead');
const emptyEl = document.getElementById('empty');
let winFrom = -1, winTo = -1;
/* The two layout numbers paint() needs. Measured once per render and on resize,
   never inside paint(): reading them there would force a synchronous layout on
   every scroll frame, right after the mutation that invalidated it - the one
   expensive thing in the loop.
   It has to be measured AFTER the body's height is set, or a table that is short
   at that moment (a narrow filter, mid-search) hands paint() a viewport of four
   rows and the next full list draws with a hole under it. */
let headH = 0, viewH = 0;
function measure() { headH = thead.offsetHeight; viewH = scroller.clientHeight; }

const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>';

/** The "vs" cell: the gap to the other dataset's rating for the same man. */
function diffHtml(i) {
  const v = D.diff[i];
  if (v === NO_DIFF) return '<span class="dif no" title="not in ' + otherTab + '">&ndash;</span>';
  const cls = v > 0 ? 'up' : v < 0 ? 'dn' : 'eq';
  const title = P.tab + ' ' + D.elo[i] + ' &middot; ' + otherTab + ' ' + (D.elo[i] - v);
  return '<span class="dif ' + cls + '" title="' + title + '">' + (v > 0 ? '+' + v : v) + '</span>';
}

function rowHtml(i, top) {
  const c = D.combo[i], t = D.tier[i], nat = D.nation[i], p = D.person[i];
  const list = D.apps[p];
  const dup = list.length > 1 ? '<span class="dup">&times;' + list.length + '</span>' : '';
  const accent = t ? '<span class="acc" style="background:' + P.tierAccents[t] + '"></span>' : '';
  const col = t
    ? '<span class="col" title="' + P.tierNames[t] + '"><span class="star" style="background:' + P.tierAccents[t] + '">'
      + STAR + '</span>Yes</span>'
    : '<span class="col no">No</span>';
  return '<div class="row cols" data-i="' + i + '" data-p="' + p + '" style="top:' + top + 'px">'
    + accent
    + '<span class="num">' + (D.num[i] || '&ndash;') + '</span>'
    + '<span class="nm"><span class="t">' + D.personHtml[p] + '</span>' + dup + '</span>'
    + '<span class="ctry"><span class="fl f' + D.set.nations[nat][0] + '"></span><span class="t">' + D.natHtml[nat] + '</span></span>'
    + '<span class="yr">' + D.set.years[D.year[i]] + '</span>'
    + '<span class="pos">' + POS[D.comboMain[c]] + '</span>'
    + '<span class="alt">' + D.comboAltHtml[c] + '</span>'
    + '<span class="rat">' + D.elo[i] + '</span>'
    + diffHtml(i)
    + col
    + '</div>';
}

function paint(force) {
  const top = Math.max(0, scroller.scrollTop - headH);
  const from = Math.max(0, Math.floor(top / ROW_H) - OVERSCAN);
  const to = Math.min(viewLen, Math.ceil((top + viewH) / ROW_H) + OVERSCAN);
  if (!force && from === winFrom && to === winTo) return;
  winFrom = from; winTo = to;
  let html = '';
  for (let k = from; k < to; k++) html += rowHtml(view[k], k * ROW_H);
  tbody.innerHTML = html;
  if (hoverPerson >= 0) markKin(hoverPerson);
}

function render() {
  applyFilters();
  tbody.style.height = viewLen * ROW_H + 'px';
  emptyEl.hidden = viewLen > 0;
  scroller.scrollTop = 0;
  measure();
  winFrom = winTo = -1;
  paint(true);
  const n = viewLen.toLocaleString('en-GB');
  document.getElementById('count').innerHTML = '<b>' + n + '</b> of ' + D.N.toLocaleString('en-GB') + ' players'
    + (dropped ? ' <span class="gone">' + dropped + ' filter value' + (dropped > 1 ? 's' : '')
      + ' not in this dataset</span>' : '');
}

let queued = false;
scroller.addEventListener('scroll', () => {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; paint(false); });
}, { passive: true });
window.addEventListener('resize', () => { measure(); paint(true); });

/* ---------------------------------------------------------------------------
   Hover: every appearance of the same person, from any one of them.
--------------------------------------------------------------------------- */
const tip = document.getElementById('tip');
let hoverPerson = -1;

function markKin(p) {
  for (const el of tbody.children) el.classList.toggle('kin', +el.dataset.p === p && p >= 0);
}

function tipHtml(p, self) {
  const list = D.apps[p];
  let h = '<div class="th2"><b>' + D.personHtml[p] + '</b>' + list.length + ' appearances</div>';
  for (const i of list) {
    const c = D.combo[i], t = D.tier[i];
    h += '<div class="ap' + (i === self ? ' self' : '') + '">'
      + '<span class="y">' + D.set.years[D.year[i]] + '</span>'
      + '<span class="fl f' + D.set.nations[D.nation[i]][0] + '"></span>'
      + '<span class="n">' + D.natHtml[D.nation[i]] + '</span>'
      + '<span class="p">' + POS[D.comboMain[c]] + '</span>'
      + '<span class="e"' + (t ? ' style="color:' + P.tierAccents[t] + '"' : '') + '>' + D.elo[i] + '</span>'
      + '</div>';
  }
  return h;
}

let tipRow = null;
function showTip(row) {
  if (row === tipRow && tip.classList.contains('show')) return;
  tipRow = row;
  const i = +row.dataset.i, p = +row.dataset.p;
  if (D.apps[p].length < 2) return hideTip();
  if (p !== hoverPerson) { hoverPerson = p; markKin(p); }
  tip.innerHTML = tipHtml(p, i);
  tip.classList.add('show');
  const r = row.getBoundingClientRect(), b = tip.getBoundingClientRect();
  let left = Math.min(r.left + 40, window.innerWidth - b.width - 12);
  let top = r.bottom + 6;
  if (top + b.height > window.innerHeight - 8) top = Math.max(8, r.top - b.height - 6);
  tip.style.left = Math.max(8, left) + 'px';
  tip.style.top = top + 'px';
}

function hideTip() {
  tipRow = null;
  tip.classList.remove('show');
  if (hoverPerson >= 0) { hoverPerson = -1; markKin(-1); }
}

tbody.addEventListener('mouseover', (e) => {
  const row = e.target.closest('.row');
  if (row) showTip(row); else hideTip();
});
tbody.addEventListener('mouseleave', hideTip);
scroller.addEventListener('scroll', hideTip, { passive: true });
// Touch: a tap on a row opens the same card, a tap anywhere else closes it.
tbody.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (row) showTip(row);
});
document.addEventListener('click', (e) => { if (!e.target.closest('.row')) hideTip(); });

/* ---------------------------------------------------------------------------
   Header: click to sort. Rebuilt per dataset, since one of them has no "Also".
--------------------------------------------------------------------------- */
/** The same columns for either dataset, in the same order, at the same widths.
 *  Only two labels change, and both name what the data is rather than how the
 *  table is built: the other dataset, and what its last column marks. */
function columns() {
  return [
    { id: 'num', label: '#', cls: 'r', dir: 1 },
    { id: 'name', label: 'Name', cls: '', dir: 1 },
    { id: 'nat', label: 'Country', cls: '', dir: 1 },
    { id: 'year', label: 'Year', cls: '', dir: -1 },
    { id: 'main', label: 'Main', cls: '', dir: 1 },
    { id: 'alt', label: 'Also', cls: '', dir: 1 },
    { id: 'rating', label: 'Rating', cls: 'r', dir: -1 },
    { id: 'diff', label: P.diffHeader, cls: 'r', dir: -1 },
    { id: 'col', label: P.colHeader, cls: 'r', dir: -1 },
  ];
}
let COLS = [];

function buildHead() {
  COLS = columns();
  if (!COLS.some((c) => c.id === state.sort)) { state.sort = 'rating'; state.dir = -1; }
  thead.innerHTML = COLS.map((c) =>
    '<span' + (c.cls ? ' style="text-align:right"' : '') + '><button class="th ' + c.cls + '" data-c="' + c.id + '" type="button">'
    + c.label + '<span class="ar">&#9660;</span></button></span>').join('');
  paintHead();
}

function paintHead() {
  for (const b of thead.querySelectorAll('.th')) {
    b.classList.toggle('on', b.dataset.c === state.sort);
    b.querySelector('.ar').innerHTML = state.dir < 0 ? '&#9660;' : '&#9650;';
  }
}
thead.addEventListener('click', (e) => {
  const b = e.target.closest('.th');
  if (!b) return;
  const id = b.dataset.c;
  if (state.sort === id) state.dir = -state.dir;
  else { state.sort = id; state.dir = COLS.find((c) => c.id === id).dir; }
  paintHead();
  render();
});

/* ---------------------------------------------------------------------------
   Multi-select filters
--------------------------------------------------------------------------- */
function multiSelect(host, opts, set, label, searchable, off) {
  // opts: [{ value, html, key, count }]. A value is whatever the state holds - a
  // position index, a nation code, a year - so the option INDEX is what travels
  // through the DOM.
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.setAttribute('aria-expanded', 'false');
  btn.innerHTML = '<span class="val"></span><span class="chev">'
    + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span>';
  const pop = document.createElement('div');
  pop.className = 'pop';
  const search = searchable
    ? '<input class="psearch" type="search" placeholder="Filter ' + label.toLowerCase() + '" autocomplete="off" />'
    : '';
  pop.innerHTML = search + '<div class="list"></div>'
    + '<div class="pfoot"><button type="button" data-a="all">Select all</button><button type="button" data-a="none">Clear</button></div>';
  host.append(btn, pop);
  const list = pop.querySelector('.list');

  // A real <button>, not a <label>: the list is keyboard reachable that way.
  const optHtml = (o) => '<button type="button" class="opt' + (set.has(o.value) ? ' on' : '') + '" data-v="' + opts.indexOf(o) + '" aria-pressed="' + set.has(o.value) + '">'
    + '<span class="box"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>'
    + '<span>' + o.html + '</span>'
    + (o.count == null ? '' : '<span class="n">' + o.count + '</span>')
    + '</button>';

  let shown = opts;
  const drawList = () => { list.innerHTML = shown.map(optHtml).join(''); };
  const drawBtn = () => {
    const v = btn.querySelector('.val');
    if (set.size === 0) { v.className = 'val any'; v.textContent = 'Any'; }
    else if (set.size === 1) {
      const only = opts.find((o) => o.value === [...set][0]);
      v.className = 'val';
      v.innerHTML = only ? only.html : '1 selected';
    } else { v.className = 'val'; v.textContent = set.size + ' selected'; }
    const old = btn.querySelector('.cnt');
    if (old) old.remove();
    if (set.size > 1) {
      const c = document.createElement('span');
      c.className = 'cnt'; c.textContent = set.size;
      btn.insertBefore(c, btn.querySelector('.chev'));
    }
  };

  const close = () => { pop.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); };
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = pop.classList.contains('open');
    document.querySelectorAll('.pop.open').forEach((p) => {
      p.classList.remove('open');
      p.parentElement.querySelector('button').setAttribute('aria-expanded', 'false');
    });
    if (!open) {
      pop.classList.add('open'); btn.setAttribute('aria-expanded', 'true');
      const s = pop.querySelector('.psearch');
      if (s) s.focus();
    }
  });
  pop.addEventListener('click', (e) => {
    e.stopPropagation();
    const el = e.target.closest('.opt');
    if (el) {
      e.preventDefault();
      const v = opts[+el.dataset.v].value;
      dropped = 0;
      if (set.has(v)) set.delete(v); else set.add(v);
      el.classList.toggle('on', set.has(v));
      el.setAttribute('aria-pressed', String(set.has(v)));
      drawBtn(); render();
      return;
    }
    const act = e.target.closest('[data-a]');
    if (act) {
      dropped = 0;
      set.clear();
      if (act.dataset.a === 'all') for (const o of shown) set.add(o.value);
      drawList(); drawBtn(); render();
    }
  });
  if (searchable) {
    pop.querySelector('.psearch').addEventListener('input', (e) => {
      const q = fold(e.target.value.trim());
      shown = q ? opts.filter((o) => o.key.includes(q)) : opts;
      drawList();
    });
  }
  document.addEventListener('click', close);
  host.addEventListener('keydown', (e) => { if (e.key === 'Escape') { close(); btn.focus(); } });

  if (off) {
    // Kept, greyed, and inert: the selection travels back to the dataset that can
    // answer it (see `fields`).
    host.classList.add('off');
    btn.disabled = true;
    btn.title = off;
  }

  drawList(); drawBtn();
  return { refresh() { shown = opts; const s = pop.querySelector('.psearch'); if (s) s.value = ''; drawList(); drawBtn(); } };
}

const posOpts = (counts) => POS.map((p, i) => ({ value: i, html: p, key: fold(p), count: counts[i] }));
const flagHtml = (code) => '<span class="fl f' + code + '" style="display:inline-block;vertical-align:-2px;margin-right:6px"></span>';

/* The same six filters in the same order for either dataset. The two extra
   position filters are unanswerable on a dataset that gives a player a single
   position, so there they are greyed out rather than removed - the row of
   controls stays put, and a selection made on one dataset is still there when
   you come back to it. */
const ONE_POSITION = '7a0 gives each player one position, so this filter has nothing to narrow';

function fields() {
  return [
    { key: 'main', label: 'Main position', opts: () => posOpts(D.mainCount) },
    { key: 'add', label: 'Additional position', off: P.alt ? '' : ONE_POSITION, opts: () => posOpts(D.addCount) },
    { key: 'any', label: 'Position (any)', off: P.alt ? '' : ONE_POSITION, opts: () => posOpts(D.anyCount) },
    {
      key: 'nat', label: 'Country', search: true,
      opts: () => D.set.nations.map((n, i) => ({
        value: n[0], html: flagHtml(n[0]) + esc(n[1]),
        key: fold(n[1]) + ' ' + n[0].toLowerCase(), count: D.natCount[i],
      })),
    },
    {
      key: 'year', label: 'World Cup',
      opts: () => D.set.years.map((y, i) => ({ value: y, html: String(y), key: String(y), count: D.yearCount[i] })),
    },
    {
      key: 'col', label: P.colHeader,
      opts: () => [
        { value: 1, html: 'Yes', key: 'yes', count: D.set.collectibles },
        { value: 0, html: 'No', key: 'no', count: D.N - D.set.collectibles },
      ],
    },
  ];
}

const msfields = document.getElementById('msfields');
let FIELDS = [];
let controls = [];

function buildFields() {
  FIELDS = fields();
  msfields.innerHTML = '';
  controls = FIELDS.map((f) => {
    const field = document.createElement('div');
    field.className = f.off ? 'field off' : 'field';
    const cap = document.createElement('span');
    cap.className = 'mono-cap';
    cap.textContent = f.label;
    const host = document.createElement('div');
    host.className = 'ms';
    host.id = 'f-' + f.key;
    field.append(cap, host);
    msfields.append(field);
    return multiSelect(host, f.opts(), state[f.key], f.label, !!f.search, f.off);
  });
}

/* ---------------------------------------------------------------------------
   Search + rating slider
--------------------------------------------------------------------------- */
const qEl = document.getElementById('q'), qClr = document.getElementById('qclr');
let qTimer = 0;
qEl.addEventListener('input', () => {
  qClr.hidden = qEl.value === '';
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = fold(qEl.value.trim()); dropped = 0; render(); }, 90);
});
qClr.addEventListener('click', () => { qEl.value = ''; qClr.hidden = true; state.q = ''; render(); qEl.focus(); });

const rmin = document.getElementById('rmin'), rmax = document.getElementById('rmax');
const rfill = document.getElementById('rfill');
const rminl = document.getElementById('rminl'), rmaxl = document.getElementById('rmaxl');

function paintRange() {
  const span = D.set.eloMax - D.set.eloMin;
  const a = (state.lo - D.set.eloMin) / span, b = (state.hi - D.set.eloMin) / span;
  rfill.style.left = a * 100 + '%';
  rfill.style.width = (b - a) * 100 + '%';
  rminl.textContent = state.lo; rmaxl.textContent = state.hi;
  rmin.value = state.lo; rmax.value = state.hi;
}
function onRange() {
  let lo = +rmin.value, hi = +rmax.value;
  if (lo > hi) { if (document.activeElement === rmin) hi = lo; else lo = hi; }
  state.lo = lo; state.hi = hi;
  state.rangeSet = lo > D.set.eloMin || hi < D.set.eloMax;
  dropped = 0;
  paintRange();
  render();
}
rmin.addEventListener('input', onRange);
rmax.addEventListener('input', onRange);

document.getElementById('reset').addEventListener('click', () => {
  state.q = ''; qEl.value = ''; qClr.hidden = true;
  for (const k of ['main', 'add', 'any', 'nat', 'year', 'col']) state[k].clear();
  state.lo = D.set.eloMin; state.hi = D.set.eloMax;
  state.rangeSet = false;
  dropped = 0;
  for (const c of controls) c.refresh();
  paintRange();
  render();
});

/* ---------------------------------------------------------------------------
   The dataset toggle
--------------------------------------------------------------------------- */
const seg = document.getElementById('seg');
let active = -1;

/** Carry the query across a switch: drop the values the incoming dataset does not
 *  hold, and clamp the rating range to its own scale. */
function pruneState(next) {
  let gone = 0;
  const codes = new Set(next.set.nations.map((n) => n[0]));
  for (const c of [...state.nat]) if (!codes.has(c)) { state.nat.delete(c); gone++; }
  const years = new Set(next.set.years);
  for (const y of [...state.year]) if (!years.has(y)) { state.year.delete(y); gone++; }
  // Positions need no translation: both datasets speak the same twelve, and a
  // position the incoming one happens not to hold simply matches nothing, which
  // is the truth rather than a dropped filter.
  if (state.rangeSet) {
    const lo = Math.max(state.lo, next.set.eloMin), hi = Math.min(state.hi, next.set.eloMax);
    state.lo = Math.min(lo, hi); state.hi = Math.max(lo, hi);
  } else {
    state.lo = next.set.eloMin; state.hi = next.set.eloMax;
  }
  dropped = gone;
}

function load(index) {
  if (index === active) return;
  const next = decode(index);
  const first = active < 0;
  if (first) { state.lo = next.set.eloMin; state.hi = next.set.eloMax; }
  else pruneState(next);
  active = index;
  D = next; P = next.page; view = next.view;

  document.title = P.docTitle;
  document.getElementById('tag').textContent = P.tag;
  document.getElementById('eyebrow').textContent = P.eyebrow;
  document.getElementById('title').textContent = P.title;
  document.getElementById('foot').textContent = D.set.footer;
  otherTab = DATA.sets.length > 1 ? DATA.sets[(index + 1) % DATA.sets.length].page.tab : '';
  // The two datasets are meant to be told apart at a glance, here and in a second
  // window of the same file.
  const tile = document.getElementById('tile');
  tile.style.background = P.tile ? P.tile[0] : '';
  tile.style.color = P.tile ? P.tile[1] : '';
  for (const b of seg.children) b.setAttribute('aria-pressed', String(+b.dataset.i === index));

  for (const el of [rmin, rmax]) { el.min = D.set.eloMin; el.max = D.set.eloMax; el.step = 1; }
  buildHead();
  buildFields();
  paintRange();
  render();
}

if (DATA.sets.length > 1) {
  document.getElementById('setlab').hidden = false;
  seg.innerHTML = DATA.sets.map((s, i) =>
    '<button type="button" data-i="' + i + '" aria-pressed="false">' + esc(s.page.tab)
    + '<span class="n">' + (s.rows.length / 7).toLocaleString('en-GB') + '</span></button>').join('');
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) load(+b.dataset.i);
  });
}

/* ---------------------------------------------------------------------------
   Theme (mirrors the app: a data-theme attribute, remembered per browser)
--------------------------------------------------------------------------- */
const themeBtn = document.getElementById('theme');
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? 'Light' : 'Dark';
  try { localStorage.setItem('wcsim_players_theme', t); } catch (e) { /* private mode */ }
}
let saved = null;
try { saved = localStorage.getItem('wcsim_players_theme'); } catch (e) { /* private mode */ }
setTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
themeBtn.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

document.documentElement.style.setProperty('--grid-cols', DATA.grid);
load(0);
// Web fonts land after the first paint and can change the header's height.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); paint(true); });
</script>
</body>
</html>
